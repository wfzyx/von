name: Go SDK

on:
  push:
    branches:
      - master
    paths:
      - "go/**"
      - ".github/workflows/go-test.yml"
  pull_request:
    branches:
      - master
    paths:
      - "go/**"
      - ".github/workflows/go-test.yml"

defaults:
  run:
    working-directory: go

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache: false

      - name: Verify formatting
        run: |
          set -euo pipefail
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt required for: $unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...
